name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the older run (its test lane is released by the always() step).
# Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chore ci-docs-only (Raja 2026-09-30): a PR or push that changes only sdlc/** or *.md skips the test jobs.
  # Jobs are skipped (not the workflow), so a future required status check still resolves. Nightly Regression
  # is unaffected. A code PR's diff includes its code, so docs commits pushed onto it still run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      # Chore test-feedback (Raja 2026-10-06): the PR's new or changed test files, run first (space-separated paths).
      unit_tests: ${{ steps.diff.outputs.unit_tests }}
      db_tests: ${{ steps.diff.outputs.db_tests }} # unused since chore ci-speed (the local RLS suite takes ~1 min)
      e2e_tests: ${{ steps.diff.outputs.e2e_tests }} # unused since chore ci-speed step 3 (a shard takes ~2 min)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-changes.mjs

  verify:
    name: Lint · typecheck · unit · build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values only; builds need them because env is validated at import.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Changed unit tests first
        if: needs.changes.outputs.unit_tests != ''
        env: { CHANGED: "${{ needs.changes.outputs.unit_tests }}" }
        run: npx vitest run --project unit $CHANGED # paths validated by scripts/ci-changes.mjs; unquoted to split
      - run: npm run test:ci
      - name: Evidence summary (unit)
        if: always()
        env: { EXPECT_SUITES: "unit" }
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-evidence, path: test-results/, retention-days: 90 }

  # Chore ci-speed step 2 (plan approved 2026-10-27): RLS runs on an EPHEMERAL local Supabase built only from
  # supabase/migrations/ (step 0: schema identical to dev, 1,197 objects). No secrets, no test lane, no shared
  # data, no US↔Mumbai round-trips: ~1 min instead of ~15–37 min on hosted dev, and no statement timeouts from
  # other runs' data. Hosted dev still runs the full RLS suite every night (Regression) and RUN_SLOW dispatches.
  # Runs in parallel with verify and e2e. "Changed RLS tests first" is gone: the whole suite takes about a minute.
  rls:
    name: RLS (local Supabase)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - name: Start local Supabase (every migration file, in order)
        run: scripts/local-db.sh start # also sets the local URL/keys + NODE_EXTRA_CA_CERTS in $GITHUB_ENV
      - run: npm run test:db:ci
      - name: Evidence summary
        if: always()
        env: { EXPECT_SUITES: "db" }
        run: |
          node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          # Counts as an annotation too, readable through the API without downloading the artifact.
          node -e 'const x=require("fs").readFileSync("test-results/junit-db.xml","utf8");const t=x.match(/<testsuites\b[^>]*>/)?.[0]??"";const a=n=>t.match(new RegExp(n+"=\"(\\d+)\""))?.[1];console.log(`::notice title=rls counts::tests=${a("tests")} failures=${a("failures")} errors=${a("errors")} skipped=${(x.match(/<skipped/g)??[]).length}`)' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rls-evidence, path: test-results/, retention-days: 90 }

  # Chore ci-speed step 3 (approved 2026-10-27/28): e2e also runs on EPHEMERAL local Supabase stacks, one per
  # shard, built only from supabase/migrations/ — no secrets, no test lane, no shared data. Trial runs 40558491885
  # and 40561352784: shards took 62–156 s of tests (hosted dev: ~29 min for the whole suite in one job). Hosted dev
  # still runs the full e2e suite nightly (Regression), on RUN_SLOW dispatches and at the staging gate.
  # "Changed e2e tests first" is gone: a shard runs in about 2 minutes.
  e2e:
    name: e2e (local Supabase, shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # every shard reports, so one failure doesn't hide others
      matrix:
        shard: [1, 2, 3]
    env:
      # Feature 10: upload links in e2e point at CI's own build.
      APP_PUBLIC_URL: http://localhost:3000
      # The app is built once below; Playwright only starts it (playwright.config.ts).
      E2E_PREBUILT: "1"
      # The browser accepts the local stack's self-signed cert (playwright.config.ts). Never set for hosted targets.
      E2E_LOCAL_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - name: Start local Supabase (every migration file, in order)
        run: scripts/local-db.sh start # sets the local URL/keys + NODE_EXTRA_CA_CERTS in $GITHUB_ENV
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}-chromium
      # The runner image ships Chrome's system libraries, so install the browser only and fall back to Playwright's
      # apt install (140–651 s in the first trial) only if Chromium can't start.
      - name: Install Chromium (browser only)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Check Chromium starts (else install system libraries)
        run: |
          if ! node -e 'require("@playwright/test").chromium.launch().then(b => b.close())'; then
            echo "::warning title=chromium::needed install-deps"; npx playwright install-deps chromium
          fi
      - name: Build (against the local stack's URL)
        run: npm run build
      - name: e2e shard ${{ matrix.shard }}/3
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Evidence summary
        if: always()
        env: { EXPECT_SUITES: "e2e" }
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "test-evidence-shard-${{ matrix.shard }}", path: "test-results/\nplaywright-report/", retention-days: 90 }

  # One status for "all e2e shards passed" (stable name for a future required check; shard names include the number).
  e2e-all:
    name: e2e (all shards)
    needs: [changes, e2e]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards green
        env: { RESULT: "${{ needs.e2e.result }}" }
        run: |
          echo "e2e shards: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::An e2e shard did not pass ($RESULT)."; exit 1; }
