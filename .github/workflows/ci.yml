name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the older run (its test lane is released by the always() step).
# Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chore ci-docs-only (Raja 2026-09-30): a PR or push that changes only sdlc/** or *.md skips the test jobs.
  # Jobs are skipped (not the workflow), so a future required status check still resolves. Nightly Regression
  # is unaffected. A code PR's diff includes its code, so docs commits pushed onto it still run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      # Chore test-feedback (Raja 2026-10-06): the PR's new or changed test files, run first (space-separated paths).
      unit_tests: ${{ steps.diff.outputs.unit_tests }}
      db_tests: ${{ steps.diff.outputs.db_tests }}
      e2e_tests: ${{ steps.diff.outputs.e2e_tests }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-changes.mjs

  verify:
    name: Lint · typecheck · unit · build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values only; builds need them because env is validated at import.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Changed unit tests first
        if: needs.changes.outputs.unit_tests != ''
        env: { CHANGED: "${{ needs.changes.outputs.unit_tests }}" }
        run: npx vitest run --project unit $CHANGED # paths validated by scripts/ci-changes.mjs; unquoted to split
      - run: npm run test:ci
      - name: Evidence summary (unit)
        if: always()
        env: { EXPECT_SUITES: "unit" }
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-evidence, path: test-results/, retention-days: 90 }

  db-and-e2e:
    name: RLS + e2e (dev Supabase)
    needs: [changes, verify]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 25 min of tests + up to 30 min waiting for a free test lane.
    # Keep below the 90-min lane lease (scripts/test-lane.mjs LEASE_MINUTES) or a slow run could lose its lane.
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }} # dev only — never prod
      # Test lanes (chore test-isolation): up to 2 runs share dev, each with its own fixture offices/users.
      TEST_LANE_HOLDER: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check dev project is awake
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health" -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
          if [ "$code" != "200" ]; then echo "::error::Dev Supabase project is paused or unreachable (HTTP $code). Resume it in the dashboard."; exit 1; fi
      - name: Take a test lane
        run: node scripts/test-lane.mjs acquire
      # Chore test-feedback (Raja 2026-10-06): the PR's new or changed RLS and e2e files run first, so a failing new
      # test stops the job in minutes instead of after the ~25 min full suites. The full suites below still run them.
      - name: Changed RLS tests first
        if: needs.changes.outputs.db_tests != ''
        env: { CHANGED: "${{ needs.changes.outputs.db_tests }}" }
        run: npx vitest run --project db $CHANGED # paths validated by scripts/ci-changes.mjs; unquoted to split
      - run: npx playwright install --with-deps chromium
      - name: Changed e2e tests first
        if: needs.changes.outputs.e2e_tests != ''
        env: { CHANGED: "${{ needs.changes.outputs.e2e_tests }}" }
        run: npx playwright test $CHANGED # builds and starts the app once more (~2 min)
      - run: npm run test:db:ci
      - run: npm run test:e2e
      - name: Evidence summary
        if: always()
        env: { EXPECT_SUITES: "db,e2e" }
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-evidence, path: "test-results/\nplaywright-report/", retention-days: 90 }
      - name: Release the test lane
        if: always()
        run: node scripts/test-lane.mjs release
