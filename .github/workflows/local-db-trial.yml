name: Local DB trial

# Chore ci-speed, step 0 (plan approved 2026-10-27): prove that supabase/migrations/ alone rebuilds the database,
# and time the RLS suite against an ephemeral local Supabase on the runner instead of hosted dev.
# Uses NO secrets and never touches dev, staging or prod. Runs only on the chore branch (or by hand).
# Removed or folded into ci.yml in step 2.
on:
  push:
    branches: [chore/ci-speed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-db-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }

      - name: Start local Supabase (applies every migration file in order)
        run: |
          start=$(date +%s)
          rc=0
          supabase start -x vector,imgproxy,logflare,supavisor,postgres-meta,mailpit,studio,realtime,edge-runtime > /tmp/start.log 2>&1 || rc=$?
          tail -40 /tmp/start.log
          if [ "$rc" != 0 ]; then
            # The migration error, readable through the API (annotations) without the raw log.
            echo "::error title=start-local::$(grep -iE 'error|ERROR:|failed|migration' /tmp/start.log | tail -15 | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit "$rc"
          fi
          echo "START_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "::notice title=start-local::seconds=$(( $(date +%s) - start ))"
          mkdir -p test-results
          supabase migration list --local > test-results/migrations-applied.txt || true

      - name: Schema fingerprint (compare with hosted dev)
        env: { DB: "postgresql://postgres:postgres@127.0.0.1:54322/postgres" }
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -At -F '|' -f scripts/schema-fingerprint.sql > test-results/fingerprint-local.psv
          wc -l test-results/fingerprint-local.psv
          node -e '
            const fs = require("fs"), c = require("crypto");
            const rows = fs.readFileSync("test-results/fingerprint-local.psv", "utf8").trim().split("\n").map(l => l.split("|"));
            const by = {};
            for (const [k, n, h] of rows) (by[k] ??= []).push([n, h]);
            const out = Object.keys(by).sort().map(k => {
              const s = by[k].sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)).map(([n, h]) => n + h).join("|");
              return `${k}|${by[k].length}|${c.createHash("md5").update(s).digest("hex")}`;
            });
            fs.writeFileSync("test-results/fingerprint-local-summary.psv", out.join("\n") + "\n");
            // One annotation, so the summary is readable through the API without downloading the artifact.
            console.log("::notice title=fingerprint-local::" + out.join("%0A"));'

      - name: Local keys for the tests
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: RLS suite against local DB (serial, as in CI today)
        id: rls
        continue-on-error: true
        run: |
          start=$(date +%s)
          rc=0
          npm run test:db:ci || rc=$?
          secs=$(( $(date +%s) - start ))
          echo "RLS_SECONDS=$secs" >> "$GITHUB_ENV"
          echo "::notice title=rls-local::exit=$rc seconds=$secs"
          node -e '
            const x = require("fs").readFileSync("test-results/junit-db.xml", "utf8");
            const f = [...x.matchAll(/<testcase classname="([^"]*)" name="([^"]*)"[^>]*>\s*<(failure|error)[^>]*message="([^"]{0,160})/g)]
              .map(m => `${m[1]} | ${m[2].slice(0, 80)} | ${m[4]}`);
            if (f.length) console.log(`::notice title=rls-local-failures (${f.length})::` + f.slice(0, 40).join("%0A"));' || true
          exit $rc

      - name: Summary
        if: always()
        run: |
          {
            echo "## Local DB trial"
            echo "- supabase start + all migrations: ${START_SECONDS:-?} s"
            echo "- RLS suite (serial): ${RLS_SECONDS:-?} s · outcome: ${{ steps.rls.outcome }}"
            echo "- Fingerprint objects: $(wc -l < test-results/fingerprint-local.psv 2>/dev/null || echo ?)"
          } >> "$GITHUB_STEP_SUMMARY"
          EXPECT_SUITES=db node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: local-db-trial, path: test-results/, retention-days: 30 }
