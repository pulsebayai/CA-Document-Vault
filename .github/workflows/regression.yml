name: Regression

# Release & regression policy (architecture.md):
# - nightly full suite against dev (catches drift: settings, paused DB, expired secrets)
# - manual run against staging before every release (release gate)
# - manual run against prod after release: SMOKE ONLY (never data-writing tests)
on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 01:30 IST
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to test"
        type: choice
        options: [dev, staging, prod]
        default: dev
      base_url:
        description: "Deployed URL (leave empty for dev: https://ca-document-vault.vercel.app)"
        required: false
      only:
        description: "Quick check: run only test files whose path contains these words (space-separated, e.g. 'inbox add-document'). Empty = full suite. A filtered run is NOT release evidence."
        required: false
        default: ""
      volume:
        description: "09 volume test only (dev): V1–V10 timings in the persistent 'e2e office volume' (seeds it first if needed, ~15–25 min). Not part of the nightly; run for 09 and at the R1 gate."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    if: ${{ !inputs.volume }}
    runs-on: ubuntu-latest
    # Full suite ≈ 26 min (RLS incl. RUN_SLOW ≈ 7, e2e ≈ 17); 30 left no headroom (run 36439895456).
    # + up to 30 min waiting for a free test lane (chore test-isolation).
    # Keep below the 90-min lane lease (scripts/test-lane.mjs LEASE_MINUTES) or a slow run could lose its lane.
    timeout-minutes: 75
    env:
      TARGET: ${{ inputs.target || 'dev' }}
      E2E_BASE_URL: ${{ inputs.base_url || 'https://ca-document-vault.vercel.app' }}
      ONLY: ${{ inputs.only || '' }}
      # Dev values by default. Staging/prod secrets are added when those environments exist.
      NEXT_PUBLIC_SUPABASE_URL: ${{ (inputs.target == 'staging' && vars.STAGING_SUPABASE_URL) || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ (inputs.target == 'staging' && vars.STAGING_SUPABASE_PUBLISHABLE_KEY) || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ (inputs.target == 'staging' && secrets.STAGING_SUPABASE_SECRET_KEY) || (inputs.target != 'prod' && secrets.DEV_SUPABASE_SECRET_KEY) || '' }}
      # Vercel › Deployment Protection › Protection Bypass for Automation. Lets e2e reach protected previews
      # (tests/e2e/preview-access.ts); sent only to E2E_BASE_URL's origin. Never needed for prod smoke.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.target != 'prod' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
      # Test lanes: up to 2 runs share a database, each with its own fixture offices/users (not needed for prod smoke).
      TEST_LANE_HOLDER: regression-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the quick-check filter
        if: env.ONLY != ''
        run: |
          if ! [[ "$ONLY" =~ ^[A-Za-z0-9._/\ -]+$ ]]; then echo "::error::'only' may contain letters, digits, spaces and . _ / - only"; exit 1; fi
          echo "::warning::Quick check (only: $ONLY) — partial run, not release evidence."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit
        if: env.TARGET != 'prod'
        run: npm run test:ci
      - name: Take a test lane
        if: env.TARGET != 'prod'
        run: node scripts/test-lane.mjs acquire # after Unit: unit tests expect the local (un-laned) fixture names
      - name: RLS (database security)
        if: env.TARGET != 'prod'
        # Quick check: $ONLY (validated above) is intentionally unquoted, one filter per word; a full run gets no extra flags.
        run: npm run test:db:ci -- ${ONLY:+--passWithNoTests $ONLY}
        env:
          # Slow tests (02 AC-17: 1,000-row CSV import < 60 s) run here, not on every PR.
          RUN_SLOW: "1"
      - name: E2E (full) against deployed URL
        if: env.TARGET != 'prod'
        run: npm run test:e2e -- ${ONLY:+--pass-with-no-tests $ONLY}
      - name: Smoke only (prod — no data-writing tests)
        if: env.TARGET == 'prod'
        run: npm run test:smoke
      - name: Evidence summary
        if: always()
        env:
          EXPECT_SUITES: ${{ env.TARGET == 'prod' && 'e2e' || 'unit,db,e2e' }}
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence-${{ env.TARGET }}
          path: |
            test-results/
            playwright-report/
          retention-days: 90
      - name: Release the test lane
        if: always() && env.TARGET != 'prod'
        run: node scripts/test-lane.mjs release

  # 09 volume test (chore, R1 gate; plan approved by Raja 2026-10-07). Dev only; one volume run at a time
  # (the office is shared by every lane and overlapping runs would distort the timings). A missed target is
  # recorded in the evidence ("MISSED"), not failed; an error (e.g. a statement timeout) fails the run.
  volume:
    if: ${{ inputs.volume }}
    runs-on: ubuntu-latest
    concurrency: { group: volume, cancel-in-progress: false }
    # Seeding ≈ 15–25 min the first time + up to 30 min waiting for a lane; below the 90-min lane lease.
    timeout-minutes: 85
    env:
      TARGET: volume-dev
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      TEST_LANE_HOLDER: volume-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Dev only
        if: inputs.target != 'dev'
        run: echo "::error::The volume test runs against dev only (target was ${{ inputs.target }})." && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Take a test lane
        run: node scripts/test-lane.mjs acquire # the V7 baseline office is per lane
      - name: Volume (V1–V10) + seeding guards
        run: npm run test:db:ci -- volume
        env:
          VOLUME: "1"
      - name: Evidence summary
        if: always()
        env:
          EXPECT_SUITES: db
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence-volume
          path: test-results/
          retention-days: 90
      - name: Release the test lane
        if: always()
        run: node scripts/test-lane.mjs release
