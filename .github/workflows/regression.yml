name: Regression

# Release & regression policy (architecture.md):
# - nightly against dev (catches drift: settings, paused DB, expired secrets). Chore test-volume (2026-11-24): the
#   job `plan` (scripts/nightly-mode.mjs) picks the full suite when main changed since the last green full run and
#   every Sunday (IST), otherwise a read-only dev smoke (job `smoke-dev`). Every dispatch below runs as before (full).
# - manual run against staging before every release (release gate)
# - manual run against prod after release: SMOKE ONLY (never data-writing tests)
on:
  schedule:
    # 20:17 UTC = 01:47 IST, off the top of the hour (chore test-volume). GitHub may start it late (4–9 h seen in Nov 2026).
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to test"
        type: choice
        options: [dev, staging, prod]
        default: dev
      base_url:
        description: "Deployed URL (empty = the target's own site: dev https://ca-document-vault.vercel.app, staging https://ca-document-vault-staging.vercel.app)"
        required: false
      only:
        description: "Quick check: run only test files whose path contains these words (space-separated, e.g. 'inbox add-document'). Empty = full suite. A filtered run is NOT release evidence."
        required: false
        default: ""
      volume:
        description: "09 volume test only (dev): V1–V10 timings in the persistent 'e2e office volume' (needs a seeded office: see scripts/volume-generate.sql; ~10 min). Not part of the nightly; run for 09 and at the R1 gate."
        type: boolean
        default: false
      nightly_mode:
        description: "Chore test-volume proof tool, dev only: 'full' or 'smoke' runs this dispatch as if it were the nightly with that mode. 'auto' = an ordinary dispatch (full). Not release evidence."
        type: choice
        options: [auto, full, smoke]
        default: auto

permissions:
  contents: read
  actions: read # job `plan` reads this workflow's earlier runs and their jobs (no writes)

jobs:
  # Chore test-volume (2026-11-24): full suite or read-only dev smoke for this run. Rules and tests:
  # scripts/nightly-mode.mjs, tests/unit/nightly-mode.test.ts. Any API failure → full (the behaviour before the chore).
  plan:
    if: ${{ !inputs.volume }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Full or smoke
        id: mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target || 'dev' }}
          NIGHTLY_MODE: ${{ inputs.nightly_mode || 'auto' }}
        run: node scripts/nightly-mode.mjs

  regression:
    needs: plan
    if: ${{ !cancelled() && !inputs.volume && needs.plan.outputs.mode != 'smoke' }} # plan failed or empty → full (fail safe)
    runs-on: ubuntu-latest
    # Full suite ≈ 26 min (RLS incl. RUN_SLOW ≈ 7, e2e ≈ 17); 30 left no headroom (run 36439895456).
    # + up to 30 min waiting for a free test lane (chore test-isolation).
    # Feature 10: the nightly job already took 65 of 75 min (2026-10-22) before 10's tests; raised to 110.
    # Keep below the 150-min lane lease (scripts/test-lane.mjs LEASE_MINUTES) or a slow run could lose its lane.
    timeout-minutes: 110
    env:
      TARGET: ${{ inputs.target || 'dev' }}
      # Each target defaults to its own site, so staging is never tested against dev's deployment.
      E2E_BASE_URL: ${{ inputs.base_url || (inputs.target == 'staging' && 'https://ca-document-vault-staging.vercel.app') || 'https://ca-document-vault.vercel.app' }}
      ONLY: ${{ inputs.only || '' }}
      # Dev values by default. Staging/prod secrets are added when those environments exist.
      NEXT_PUBLIC_SUPABASE_URL: ${{ (inputs.target == 'staging' && vars.STAGING_SUPABASE_URL) || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ (inputs.target == 'staging' && vars.STAGING_SUPABASE_PUBLISHABLE_KEY) || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Each target gets only its own key: never dev's key against staging (fails closed in "Check the target's settings").
      SUPABASE_SECRET_KEY: ${{ (inputs.target == 'staging' && secrets.STAGING_SUPABASE_SECRET_KEY) || ((inputs.target || 'dev') == 'dev' && secrets.DEV_SUPABASE_SECRET_KEY) || '' }}
      # Vercel › Deployment Protection › Protection Bypass for Automation. Lets e2e reach protected previews
      # (tests/e2e/preview-access.ts); sent only to E2E_BASE_URL's origin. Never needed for prod smoke.
      # One secret per Vercel project: staging has its own (ca-document-vault-staging).
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ (inputs.target == 'staging' && secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET) || ((inputs.target || 'dev') == 'dev' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET) || '' }}
      # Test lanes: up to 2 runs share a database, each with its own fixture offices/users (not needed for prod smoke).
      TEST_LANE_HOLDER: regression-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the target's settings
        if: env.TARGET == 'staging'
        env:
          HAS_URL: ${{ vars.STAGING_SUPABASE_URL != '' }}
          HAS_PUB: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY != '' }}
          HAS_SECRET: ${{ secrets.STAGING_SUPABASE_SECRET_KEY != '' }}
          HAS_BYPASS: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          missing=""
          [ "$HAS_URL" = true ] || missing="$missing vars.STAGING_SUPABASE_URL"
          [ "$HAS_PUB" = true ] || missing="$missing vars.STAGING_SUPABASE_PUBLISHABLE_KEY"
          [ "$HAS_SECRET" = true ] || missing="$missing secrets.STAGING_SUPABASE_SECRET_KEY"
          [ "$HAS_BYPASS" = true ] || missing="$missing secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET"
          if [ -n "$missing" ]; then echo "::error::Staging settings missing:$missing"; exit 1; fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in *uszjymzaggyobxwycrde*) ;; *) echo "::error::STAGING_SUPABASE_URL is not the staging project"; exit 1;; esac
      - name: Check the quick-check filter
        if: env.ONLY != ''
        run: |
          if ! [[ "$ONLY" =~ ^[A-Za-z0-9._/\ -]+$ ]]; then echo "::error::'only' may contain letters, digits, spaces and . _ / - only"; exit 1; fi
          echo "::warning::Quick check (only: $ONLY) — partial run, not release evidence."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit
        if: env.TARGET != 'prod'
        run: npm run test:ci
      - name: Take a test lane
        if: env.TARGET != 'prod'
        run: node scripts/test-lane.mjs acquire # after Unit: unit tests expect the local (un-laned) fixture names
      - name: RLS (database security)
        if: env.TARGET != 'prod'
        # Quick check: $ONLY (validated above) is intentionally unquoted, one filter per word; a full run gets no extra flags.
        run: npm run test:db:ci -- ${ONLY:+--passWithNoTests $ONLY}
        env:
          # Slow tests (02 AC-17: 1,000-row CSV import < 60 s) run here, not on every PR.
          RUN_SLOW: "1"
      - name: E2E (full) against deployed URL
        if: env.TARGET != 'prod'
        run: npm run test:e2e -- ${ONLY:+--pass-with-no-tests $ONLY}
      - name: Smoke only (prod — no data-writing tests)
        if: env.TARGET == 'prod'
        run: npm run test:smoke
      - name: Evidence summary
        if: always()
        env:
          EXPECT_SUITES: ${{ env.TARGET == 'prod' && 'e2e' || 'unit,db,e2e' }}
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence-${{ env.TARGET }}
          path: |
            test-results/
            playwright-report/
          retention-days: 90
      - name: Release the test lane
        if: always() && env.TARGET != 'prod'
        run: node scripts/test-lane.mjs release

  # Chore test-volume (2026-11-24): the nightly on a night when main is unchanged (job `plan` says smoke). Read-only:
  # one service-role read (scripts/dev-preflight.mjs: expired key, paused DB) + the prod-safe smoke specs against
  # dev's deployed site. No test lane, no writes. Dev only: every value below is dev's, never staging's or prod's.
  smoke-dev:
    needs: plan
    if: ${{ !inputs.volume && needs.plan.outputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: dev-smoke
      E2E_BASE_URL: https://ca-document-vault.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dev key and database (one read, no writes)
        id: preflight
        run: node scripts/dev-preflight.mjs
      - name: Smoke against dev's deployed site (read-only)
        # Runs even when the preflight failed, so one night reports both the database and the site.
        if: ${{ !cancelled() && (success() || steps.preflight.outcome == 'failure') }}
        run: npm run test:smoke
      - name: Evidence summary
        if: always()
        env:
          EXPECT_SUITES: e2e
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence-smoke-dev
          path: |
            test-results/
            playwright-report/
          retention-days: 90

  # 09 volume test (chore, R1 gate; plan approved by Raja 2026-10-07). Dev only; one volume run at a time
  # (the office is shared by every lane and overlapping runs would distort the timings). A missed target is
  # recorded in the evidence ("MISSED"; a statement timeout as TIMEOUT), not failed; any other error fails the run.
  volume:
    if: ${{ inputs.volume }}
    runs-on: ubuntu-latest
    concurrency: { group: volume, cancel-in-progress: false }
    # Seeding ≈ 15–25 min the first time + up to 30 min waiting for a lane; below the 150-min lane lease.
    timeout-minutes: 85
    env:
      TARGET: volume-dev
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      TEST_LANE_HOLDER: volume-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Dev only
        if: inputs.target != 'dev'
        run: echo "::error::The volume test runs against dev only (target was ${{ inputs.target }})." && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Take a test lane
        run: node scripts/test-lane.mjs acquire # the V7 baseline office is per lane
      - name: Volume (V1–V10) + seeding guards
        run: npm run test:db:ci -- volume
        env:
          VOLUME: "1"
      - name: Evidence summary
        if: always()
        env:
          EXPECT_SUITES: db
        run: node scripts/regression-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence-volume
          path: test-results/
          retention-days: 90
      - name: Release the test lane
        if: always()
        run: node scripts/test-lane.mjs release
