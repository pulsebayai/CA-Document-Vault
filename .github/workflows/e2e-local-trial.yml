name: e2e local trial

# Chore ci-speed step 3 trial (approved 2026-10-27): the full e2e suite against an EPHEMERAL local Supabase,
# split into 3 shards, each with its own local database and app build. Measures how much of e2e's ~30 min on
# hosted dev is latency, and which tests depend on hosted-only behaviour. Uses NO secrets and never touches dev.
# Runs only on the trial branch (or by hand). Folded into ci.yml (or removed) once the trial is read.
on:
  push:
    branches: [chore/ci-speed-e2e]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-local-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e local (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      APP_PUBLIC_URL: http://localhost:3000
      E2E_PREBUILT: "1"
      E2E_LOCAL_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }
      - name: Start local Supabase (every migration file, in order)
        run: scripts/local-db.sh start # sets the local URL/keys + NODE_EXTRA_CA_CERTS in $GITHUB_ENV
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build (against the local stack's URL)
        run: npm run build
      - name: e2e shard ${{ matrix.shard }}/3
        id: e2e
        run: |
          begin=$(date +%s)
          rc=0
          npx playwright test --shard=${{ matrix.shard }}/3 || rc=$?
          secs=$(( $(date +%s) - begin ))
          node -e '
            const s = JSON.parse(require("fs").readFileSync("test-results/e2e-results.json", "utf8")).stats ?? {};
            console.log(`::notice title=e2e-local shard ${{ matrix.shard }}::exit='"$rc"' seconds='"$secs"' expected=${s.expected} unexpected=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped}`);' || \
            echo "::notice title=e2e-local shard ${{ matrix.shard }}::exit=$rc seconds=$secs (no results file)"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-local-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
